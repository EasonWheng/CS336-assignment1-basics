# OWT 终极版：24 层、1280 维、约 554M 参数
# 327.68M token（batch 16 × context 512 × 40000 步）。
# 目标卡：B200 180GB。bf16 autocast 下激活约 22.8GB，加权重/梯度/优化器约 8.9GB，总约 31.7GB；
# fp32 激活约 45.6GB，总约 54.5GB。当前训练循环还没有 dtype 开关，开跑前先确认 bf16 支持。
# 训练时长按 1k 步实测的 step/s 再决定是否加步数；这个配置优先质量和 2 小时级预算的平衡。

model:
  vocab_size: 32000
  context_length: 512
  d_model: 1280
  num_layers: 24
  num_heads: 32
  d_ff: 3392
  rope_theta: 10000.0

optimizer:
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 1000
  total_steps: 40000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/owt_train.npy
  val_data: data/owt_val.npy
  batch_size: 16
  device: cuda

run:
  seed: 42
  precision: bf16
  log_interval: 20
  eval_interval: 500
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: owt_ultimate_24l1280

checkpoint:
  checkpoint_dir: checkpoints/ultimate/owt_24l1280
  checkpoint_interval: 5000
  resume: null
