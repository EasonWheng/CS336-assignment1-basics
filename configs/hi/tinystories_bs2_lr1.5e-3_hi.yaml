# TinyStories 训练配置
# 对应手册 7.2 节的低资源配置：batch 32 × 5000 步 × 256 = 40,960,000 token。
# 科学计数法保留小数点，避免 PyYAML 解析成字符串。

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.5e-3
  min_lr: 1.5e-4
  warmup_steps: 200
  total_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/tiny_train.npy
  val_data: data/tiny_val.npy
  batch_size: 2
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: tinystories_bs2_lr1.5e-3_hi

checkpoint:
  checkpoint_dir: checkpoints/tmp_hi
  checkpoint_interval: 5000
  resume: null
