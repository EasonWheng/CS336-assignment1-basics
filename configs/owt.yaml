# OpenWebText 训练配置
# 词表规模 32000，模型架构与训练步数沿用 TinyStories 的设置。
# 本机内存不足以训练 OWT 分词器，这份配置等分词产物准备好后再使用。

model:
  vocab_size: 32000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 200
  total_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/owt_train.npy
  val_data: data/owt_valid.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20

checkpoint:
  checkpoint_dir: checkpoints/owt
  checkpoint_interval: 500
  resume: null
