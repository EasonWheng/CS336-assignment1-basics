# B200 45 分钟排行榜：500 步基准测试
# 8L / 768，batch 64 × context 512 = 32,768 token/step。
# 先测 token/s，再按 45 分钟换算正式步数。bf16 需要训练循环支持 autocast。

model:
  vocab_size: 32000
  context_length: 512
  d_model: 768
  num_layers: 8
  num_heads: 12
  d_ff: 2048
  rope_theta: 10000.0

optimizer:
  max_lr: 2.0e-3
  min_lr: 2.0e-4
  warmup_steps: 100
  total_steps: 500
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/owt_train.npy
  val_data: data/owt_val.npy
  batch_size: 64
  device: cuda

run:
  seed: 42
  precision: bf16
  log_interval: 20
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: owt_b200_bench500

checkpoint:
  checkpoint_dir: checkpoints/leaderboard/owt_b200_bench500
  checkpoint_interval: 500
  resume: null
