# TinyStories 训练配置
# 数值与 cs336_basics/train.py 的 GROUPS 默认值一致。
# 科学计数法保留小数点，避免 PyYAML 解析成字符串。

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 200
  total_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/train.npy
  val_data: data/val.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20

checkpoint:
  checkpoint_dir: checkpoints
  checkpoint_interval: 500
  resume: null
