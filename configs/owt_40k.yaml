# OpenWebText 主实验
# batch 32 × 40000 步 × context 256 = 327,680,000 token，
# 与 TinyStories 的 40k 长训练使用相同的迭代次数和 token 预算。
# max_lr 先填 1.0e-3，预扫描结束后替换成最佳值。

model:
  vocab_size: 32000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 1000
  total_steps: 40000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/owt_train.npy
  val_data: data/owt_val.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: owt_40k

checkpoint:
  checkpoint_dir: checkpoints/owt_40k
  checkpoint_interval: 5000
  resume: null
