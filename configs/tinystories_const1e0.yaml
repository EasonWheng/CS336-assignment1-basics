# TinyStories 训练配置
# 恒定学习率 1.0: max_lr = min_lr, 预热 200 步后保持 1.0。

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0
  min_lr: 1.0
  warmup_steps: 200
  total_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/tiny_train.npy
  val_data: data/tiny_val.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: tinystories_const1e0

checkpoint:
  checkpoint_dir: checkpoints/const1e0
  checkpoint_interval: 1000
  resume: null
