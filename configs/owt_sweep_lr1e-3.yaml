# OpenWebText 学习率预扫描
# batch 32，5000 步，共 40.96M token；只比较最终验证损失。

model:
  vocab_size: 32000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 200
  total_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/owt_train.npy
  val_data: data/owt_val.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: owt_sweep_lr1e-3

checkpoint:
  checkpoint_dir: checkpoints/owt_sweep_lr1e-3
  checkpoint_interval: 5000
  resume: null
