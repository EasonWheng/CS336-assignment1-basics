# TinyStories 训练配置
# 长训练：batch 32 × 40000 步 × 256 = 327,680,000 token。

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

optimizer:
  max_lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 1000
  total_steps: 40000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  grad_clip: 1.0

data:
  train_data: data/tiny_train.npy
  val_data: data/tiny_val.npy
  batch_size: 32
  device: cpu

run:
  seed: 42
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  wandb_enabled: true
  wandb_project: cs336-a1
  run_name: tinystories_long40k

checkpoint:
  checkpoint_dir: checkpoints/long40k
  checkpoint_interval: 4000
  resume: null
